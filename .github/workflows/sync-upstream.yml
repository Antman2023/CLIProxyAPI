name: Sync upstream and release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: router-for-me/CLIProxyAPI
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null ||             git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --prune upstream "${TARGET_BRANCH}"
          git fetch --force --tags upstream

      - name: Merge upstream
        id: sync
        run: |
          set -euo pipefail

          before="$(git rev-parse HEAD)"
          upstream_head="$(git rev-parse "upstream/${TARGET_BRANCH}")"

          echo "before=${before}"
          echo "upstream_head=${upstream_head}"

          if git merge-base --is-ancestor "${upstream_head}" HEAD; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Fork already contains upstream/${TARGET_BRANCH}."
            exit 0
          fi

          if ! git merge --no-edit "upstream/${TARGET_BRANCH}"; then
            echo "::error::Upstream merge has conflicts. No changes were pushed."
            git merge --abort || true
            exit 1
          fi

          after="$(git rev-parse HEAD)"
          echo "after=${after}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "merge_sha=${after}" >> "${GITHUB_OUTPUT}"

          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Find latest upstream release
        id: upstream_release
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          upstream_tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"

          if [[ ! "${upstream_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected upstream release tag: ${upstream_tag}"
            exit 1
          fi

          git fetch --force upstream "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"

          if ! git merge-base --is-ancestor "${upstream_tag}^{commit}" HEAD; then
            echo "::error::Merged main does not contain latest upstream release ${upstream_tag}."
            exit 1
          fi

          echo "tag=${upstream_tag}" >> "${GITHUB_OUTPUT}"
          echo "Using upstream release ${upstream_tag}"

      - name: Dispatch release workflow
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream_release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yaml             --repo "${GITHUB_REPOSITORY}"             --ref "${TARGET_BRANCH}"             -f "upstream_tag=${UPSTREAM_TAG}"

          echo "Dispatched release.yaml for ${UPSTREAM_TAG}."
