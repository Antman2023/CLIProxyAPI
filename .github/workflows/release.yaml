name: release

on:
  workflow_dispatch:
  push:
    # run only against tags
    tags:
      - 'v*-antman.*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  UPSTREAM_REPO: router-for-me/CLIProxyAPI
  GO_VERSION: '1.26.4'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
      - name: Create release
        id: release-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_notes_file="$(mktemp)"
          generated_notes_file="$(mktemp)"
          changelog_entries_file="$(mktemp)"
          changelog_notes_file="$(mktemp)"
          updated_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file" "$generated_notes_file" "$changelog_entries_file" "$changelog_notes_file" "$updated_notes_file"' EXIT

          upstream_tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest upstream release has unsupported tag: ${upstream_tag}" >&2
            exit 1
          fi

          git fetch --force "https://github.com/${UPSTREAM_REPO}.git" \
            "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"
          if ! git merge-base --is-ancestor "${upstream_tag}^{commit}" HEAD; then
            echo "Current commit must include latest upstream release ${upstream_tag}" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git fetch --force --tags origin
            latest_sequence="$(
              while IFS= read -r existing_tag; do
                sequence="${existing_tag#"${upstream_tag}-antman."}"
                if [[ "$sequence" =~ ^[1-9][0-9]*$ ]]; then
                  printf '%s\n' "$sequence"
                fi
              done < <(git tag --list "${upstream_tag}-antman.*")
            )"
            latest_sequence="$(
              printf '%s\n' "$latest_sequence" |
                sort -n |
                tail -n 1
            )"
            next_sequence="$(( ${latest_sequence:-0} + 1 ))"
            release_tag="${upstream_tag}-antman.${next_sequence}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$release_tag" -m "Release ${release_tag}"
            git push origin "refs/tags/${release_tag}"
          elif [[ "$GITHUB_REF_NAME" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-antman\.([1-9][0-9]*)$ ]]; then
            release_tag="$GITHUB_REF_NAME"
            if [[ "${BASH_REMATCH[1]}" != "$upstream_tag" ]]; then
              echo "${release_tag} is based on ${BASH_REMATCH[1]}, but latest upstream release is ${upstream_tag}" >&2
              exit 1
            fi
          else
            echo "Release tag must use the format vX.Y.Z-antman.N" >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

          cat > "$release_notes_file" <<'EOF'
          <!-- cliproxyapi-linux-release-assets:start -->
          ## Linux release assets

          - `CLIProxyAPI_<version>_linux_<arch>.tar.gz` supports dynamic library plugins and is built against a GLIBC 2.17 baseline.

          <!-- cliproxyapi-linux-release-assets:end -->
          EOF

          changelog_range="${upstream_tag}..${release_tag}"

          git log --reverse --pretty=format:'- %s (%h)' "$changelog_range" |
            grep -Ev '^- (docs:|test:)' > "$changelog_entries_file" || true

          if ! gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$release_tag" \
            -f previous_tag_name="$upstream_tag" \
            --jq .body > "$generated_notes_file"; then
            : > "$generated_notes_file"
          fi
          if [[ ! -s "$generated_notes_file" ]]; then
            printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$upstream_tag" "$release_tag" > "$generated_notes_file"
          fi

          {
            if [[ -s "$changelog_entries_file" ]]; then
              printf '## Changelog\n\n'
              cat "$changelog_entries_file"
              printf '\n\n'
            fi
            cat "$generated_notes_file"
          } > "$changelog_notes_file"

          {
            cat "$release_notes_file"
            printf '\n'
            cat "$changelog_notes_file"
          } > "$updated_notes_file"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --title "$release_tag" --notes-file "$updated_notes_file"
          else
            gh release create "$release_tag" --title "$release_tag" --notes-file "$updated_notes_file"
          fi

  build-linux:
    name: build linux-${{ matrix.goarch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.release_tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - name: Generate Build Metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e RELEASE_VERSION \
            -e COMMIT \
            -e BUILD_DATE \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/

              glibc_versions="$(readelf --version-info "'"$archive_dir"'/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                  exit 1
                fi
              fi
            '

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release archive found" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  publish-checksums:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - prepare-release
      - build-linux
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish final checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(CLIProxyAPI_*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No release archives found"
            exit 0
          fi
          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          gh release upload "$RELEASE_TAG" checksums.txt --clobber
